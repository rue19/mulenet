# MuleNet services against the local chain (infra/local/standalone.yml), §4.7.
# Host networking keeps the 127.0.0.1 URLs from infra/config/undeployed.json valid.
# Prerequisites: keygen + bootstrap (infra/secrets, infra/state), proof server on :6301.
#   docker compose -f infra/docker-compose.services.yml up -d --build
x-service: &service
  image: mulenet/services
  depends_on: { init-data: { condition: service_completed_successfully } }
  build: { context: .., dockerfile: infra/Dockerfile }
  network_mode: host
  restart: unless-stopped
  environment: &env
    MULENET_ROOT: /app
    MULENET_NETWORK: undeployed
    MULENET_DEPLOYMENT: ${MULENET_DEPLOYMENT:-main}
    MN_PROOF_SERVER: http://127.0.0.1:6301
  volumes:
    - ../infra/config:/app/infra/config:ro
    - ../infra/state:/app/infra/state:ro
    - ../infra/secrets:/app/infra/secrets:ro
    - mulenet-data:/app/.data

services:
  # Named volumes are created root-owned; hand /app/.data to the image's `node` user once.
  init-data:
    image: mulenet/services
    user: root
    entrypoint: ['sh', '-c', 'chown -R node:node /app/.data']
    volumes: ['mulenet-data:/app/.data']
  oracle-1: { <<: *service, command: services/oracle, environment: { <<: *env, ORACLE_INDEX: '1' } }
  oracle-2: { <<: *service, command: services/oracle, environment: { <<: *env, ORACLE_INDEX: '2' } }
  oracle-3: { <<: *service, command: services/oracle, environment: { <<: *env, ORACLE_INDEX: '3' } }
  relay: { <<: *service, command: services/relay }
  sponsor: { <<: *service, command: services/sponsor, environment: { <<: *env, SPONSOR_KEEPER: '${SPONSOR_KEEPER:-1}' } }
  bank-a: { <<: *service, command: services/bank-node, environment: { <<: *env, BANK_ID: bank-a, MULENET_DEMO_HOOKS: '${MULENET_DEMO_HOOKS:-0}' }, depends_on: [sponsor, relay, oracle-1, oracle-2, oracle-3] }
  bank-b: { <<: *service, command: services/bank-node, environment: { <<: *env, BANK_ID: bank-b, MULENET_DEMO_HOOKS: '${MULENET_DEMO_HOOKS:-0}' }, depends_on: [sponsor, relay, oracle-1, oracle-2, oracle-3] }
  bank-c: { <<: *service, command: services/bank-node, environment: { <<: *env, BANK_ID: bank-c, MULENET_DEMO_HOOKS: '${MULENET_DEMO_HOOKS:-0}' }, depends_on: [sponsor, relay, oracle-1, oracle-2, oracle-3] }
  bank-d: { <<: *service, command: services/bank-node, environment: { <<: *env, BANK_ID: bank-d, MULENET_DEMO_HOOKS: '${MULENET_DEMO_HOOKS:-0}' }, depends_on: [sponsor, relay, oracle-1, oracle-2, oracle-3] }
  bank-e: { <<: *service, command: services/bank-node, environment: { <<: *env, BANK_ID: bank-e, MULENET_DEMO_HOOKS: '${MULENET_DEMO_HOOKS:-0}' }, depends_on: [sponsor, relay, oracle-1, oracle-2, oracle-3] }
  guardian-1: { <<: *service, command: services/guardian, environment: { <<: *env, GUARDIAN_INDEX: '1' }, depends_on: [sponsor] }
  guardian-2: { <<: *service, command: services/guardian, environment: { <<: *env, GUARDIAN_INDEX: '2' }, depends_on: [sponsor] }
  guardian-3: { <<: *service, command: services/guardian, environment: { <<: *env, GUARDIAN_INDEX: '3' }, depends_on: [sponsor] }
  explorer: { <<: *service, command: services/explorer }
  console:
    image: mulenet/console
    build: { context: .., dockerfile: infra/Dockerfile, target: console }
    network_mode: host
    restart: unless-stopped
    environment: { MULENET_ROOT: /app, MULENET_NETWORK: undeployed, MULENET_DEPLOYMENT: '${MULENET_DEPLOYMENT:-main}', HOSTNAME: 127.0.0.1 }
    volumes:
      - ../infra/config:/app/infra/config:ro
      - ../infra/state:/app/infra/state:ro
      - ../infra/secrets:/app/infra/secrets:ro

volumes:
  mulenet-data: {}
